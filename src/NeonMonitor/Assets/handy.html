<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181A">
<title>NeonMonitor</title>
<style>
  /* Gleiche Farben wie die Desktop-App */
  :root { --bg:#15181A; --panel:#23282B; --track:#373E43; --accent:#3DDC97; --second:#C5D0CD;
          --text:#E4EAE8; --dim:#8B969A; --warn:#E8B44C; --crit:#E5626F; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Bahnschrift,"Segoe UI",system-ui,sans-serif;
         padding:12px 12px calc(12px + env(safe-area-inset-bottom)); }
  header { display:flex; justify-content:space-between; align-items:center; margin:2px 4px 10px; }
  header h1 { font-size:18px; margin:0; font-weight:600; } header h1 span { color:var(--accent); }
  #status { font-size:12px; color:var(--dim); }
  #rec { color:var(--crit); font-weight:600; display:none; margin-left:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; }
  .card { background:var(--panel); border-radius:14px; padding:12px 14px; }
  .card h2 { font-size:13px; color:var(--accent); margin:0 0 6px; font-weight:600; letter-spacing:.3px; }
  .big { font-size:40px; line-height:1.1; } .big small { font-size:14px; color:var(--dim); }
  .row { display:flex; justify-content:space-between; gap:8px; font-size:14px; margin:5px 0 2px; }
  .row span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .row b { font-weight:600; white-space:nowrap; }
  .bar { height:5px; background:var(--track); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); width:0; transition:width .4s; }
  .warn b { color:var(--warn); } .warn .bar i { background:var(--warn); }
  .crit b { color:var(--crit); } .crit .bar i { background:var(--crit); }
  canvas { width:100%; height:70px; display:block; margin-top:6px; }
  .sub { font-size:12px; color:var(--dim); }
  .wide { grid-column:1/-1; }
</style>
</head>
<body>
<header>
  <h1><span>●</span> NeonMonitor<span id="rec"></span></h1>
  <div id="status">verbinde …</div>
</header>

<div class="grid">
  <div class="card wide">
    <h2 id="game">FPS</h2>
    <div class="big"><span id="fps">—</span> <small>FPS</small></div>
    <div class="sub" id="fpsSub"></div>
    <canvas id="cFps"></canvas>
  </div>

  <div class="card">
    <h2>CPU</h2>
    <div id="cpu"></div>
  </div>
  <div class="card">
    <h2>GPU</h2>
    <div id="gpu"></div>
  </div>
  <div class="card">
    <h2>Temperaturverlauf</h2>
    <div class="sub"><span style="color:var(--accent)">■</span> CPU &nbsp; <span style="color:var(--second)">■</span> GPU-Hotspot</div>
    <canvas id="cTemp"></canvas>
  </div>
  <div class="card">
    <h2>RAM &amp; Kühlung</h2>
    <div id="misc"></div>
  </div>
  <div class="card">
    <h2>Verbindung</h2>
    <div id="net"></div>
  </div>
</div>

<script>
// Schlüssel aus der eigenen Adresse übernehmen
const key = new URLSearchParams(location.search).get('k') || '';
const hist = { fps: [], cpu: [], hot: [] };
const N = 120;

const fmt = (v, d = 0) => v === null || v === undefined ? '—' : Number(v).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });

// Zeile mit Balken; warn/crit = Schwellen für Farbe
function row(label, value, unit, max, warn, crit, digits = 0) {
  const pct = value == null ? 0 : Math.min(100, value / max * 100);
  const cls = value != null && crit != null && value >= crit ? 'crit' : value != null && warn != null && value >= warn ? 'warn' : '';
  return `<div class="${cls}"><div class="row"><span>${label}</span><b>${fmt(value, digits)} ${value == null ? '' : unit}</b></div>` +
         `<div class="bar"><i style="width:${pct}%"></i></div></div>`;
}

function push(arr, v) { arr.push(v == null ? NaN : v); if (arr.length > N) arr.shift(); }

// Einfaches Liniendiagramm auf <canvas>
function draw(id, series, colors, min, maxFloor) {
  const c = document.getElementById(id), dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height);
  const all = series.flat().filter(v => !isNaN(v));
  const max = Math.max(maxFloor, ...all) * 1.05;
  g.strokeStyle = 'rgba(255,255,255,.08)'; g.lineWidth = dpr;
  [0.5, 1].forEach(f => { const y = c.height - f * c.height + dpr; g.beginPath(); g.moveTo(0, y); g.lineTo(c.width, y); g.stroke(); });
  series.forEach((s, k) => {
    g.strokeStyle = colors[k]; g.lineWidth = 2 * dpr; g.beginPath(); let open = false;
    s.forEach((v, i) => {
      if (isNaN(v)) { open = false; return; }
      const x = (N - s.length + i) / (N - 1) * c.width, y = c.height - (v - min) / (max - min) * (c.height - 2 * dpr) - dpr;
      open ? g.lineTo(x, y) : g.moveTo(x, y); open = true;
    });
    g.stroke();
  });
}

async function tick() {
  try {
    const r = await fetch('api?k=' + encodeURIComponent(key), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    document.getElementById('status').textContent = 'live · ' + d.time;

    const rec = document.getElementById('rec');
    rec.style.display = d.recording ? 'inline' : 'none'; rec.textContent = d.recording ? ' ● REC ' + d.recording : '';

    document.getElementById('game').textContent = d.game ? d.game : 'FPS – kein Spiel erkannt';
    document.getElementById('fps').textContent = fmt(d.fps);
    const bn = { GPU: 'GPU-Limit', CPU: 'CPU-Limit', Limit: 'FPS-Grenze', Ausgeglichen: 'ausgeglichen' }[d.bottleneck] || '';
    document.getElementById('fpsSub').textContent = d.fps == null ? '' :
      `1% Low ${fmt(d.low1)} · ${fmt(d.frametime, 1)} ms · Latenz ${fmt(d.latency, 1)} ms · ${fmt(d.stutters, 1)} Ruckler/min` + (bn ? ' · ' + bn : '');

    document.getElementById('cpu').innerHTML =
      row('Last', d.cpu.load, '%', 100, 90, null) + row('Temperatur', d.cpu.temp, '°C', 100, 80, 90) +
      row('Leistung', d.cpu.power, 'W', 150) + row('Takt Ø', d.cpu.clock, 'MHz', 5500);
    document.getElementById('gpu').innerHTML =
      row('Last', d.gpu.load, '%', 100) + row('Temperatur', d.gpu.temp, '°C', 100, 80, 90) +
      row('Hotspot', d.gpu.hotspot, '°C', 110, 95, 105) + row('VRAM-Temp', d.gpu.memTemp, '°C', 110, 90, 100) +
      row('Leistung', d.gpu.power, 'W', 340) + row('VRAM', d.gpu.vram, 'GB', d.gpu.vramTotal || 16, null, null, 1);
    document.getElementById('misc').innerHTML =
      row('RAM', d.ram.load, '%', 100, 85, 95) + row('CPU-Lüfter', d.cpu.fan, 'rpm', 2000) +
      row('Gehäuse', d.caseFan, 'rpm', 2000) + row('GPU-Lüfter', d.gpu.fan, 'rpm', 3000);
    document.getElementById('net').innerHTML =
      row('Ping Internet', d.net.ping, 'ms', 100, 60, 100) + row('Verlust Internet', d.net.loss, '%', 10, 1, 3, 1) +
      row('Verlust Router', d.net.lossRouter, '%', 10, 1, 3, 1) + `<div class="sub">${d.net.type || ''}</div>`;

    push(hist.fps, d.fps); push(hist.cpu, d.cpu.temp); push(hist.hot, d.gpu.hotspot);
    draw('cFps', [hist.fps], ['#3DDC97'], 0, 60);
    draw('cTemp', [hist.cpu, hist.hot], ['#3DDC97', '#C5D0CD'], 0, 100);
  } catch (e) {
    document.getElementById('status').textContent = 'keine Verbindung zum PC …';
  }
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
